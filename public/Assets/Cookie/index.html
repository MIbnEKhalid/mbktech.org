<!--
  Cookie consent notice.
  This fragment is injected into the page by /Assets/Scripts/cookie.js
  (into the #cookie placeholder in the layout). Styling lives in
  /Assets/Style/tailwind.css under #cookieNotice.
-->
<div id="cookieNotice" style="display: none;">

    <button type="button" id="closeIcon" onclick="hideOverlay();" aria-label="Dismiss cookie notice">
        <i class="fas fa-times"></i>
    </button>

    <div class="title-wrap">
        <i class="fas fa-cookie-bite"></i>
        <h4>Cookie Consent</h4>
    </div>

    <div class="content-wrap">
        <div class="msg-wrap">
            <p>
                This website uses cookies. By continuing to use our website, you agree to our
                <a href="/PrivacyPolicy" target="_blank">Privacy Policy</a> and
                <a href="/Terms&Conditions" target="_blank">Terms &amp; Conditions</a>.
            </p>
            <div class="btn-wrap">
                <button id="agreeButton" class="buttons" onclick="SaveCookie();">Accept</button>
            </div>
        </div>
    </div>

</div>
